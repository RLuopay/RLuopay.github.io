<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<link rel="stylesheet" href="style.css" />

<body>
  <div class="glow" aria-hidden="true"></div>

  <header>
    <a class="brand" href="index.html"><span class="mark">◈</span> Claude 小站</a>
    <nav>
      <a href="recharge.html">充值</a>
      <a href="logs.html">日志</a>
      <a href="stocks.html">行情</a>
    </nav>
  </header>

  <main>
    <div class="hero">
      <span class="eyebrow">For QQ · Claude</span>
      <h1>给 Mika 的 Claude 花米！<br /><span class="grad">查股股、充米米、查日志</span></h1>
      <p class="lead">专门为供奉 Claude 大小姐开的网站^ω^</p>

    <section>
      <div class="sec-head"><h2>想干点啥</h2><span>点一个进去</span></div>
      <div class="grid">
        <a class="entry-link" href="recharge.html">
          <div class="card">
            <div class="entry-ico">¥</div>

          <div class="card">
            <div class="entry-ico">☰</div>
            <h3>查日志</h3>
            <p>按 QQ 号查最近的开通记录和每日用量，心里有数。</p>
            <span class="go">去查查 →</span>
          </div>
        </a>
        <a class="entry-link" href="stocks.html">
          <div class="card">
            <div class="entry-ico">↗</div>
            <h3>查股股</h3>
            <p>常用行情一眼看，想看实时的再点去东方财富。</p>
            <span class="go">去瞧瞧 →</span>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <span>© <span id="year">2026</span> Claude 小站</span>
    <span>本站仅作服务说明，行情为示例数据。</span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
