<!DOCTYPE html>

  <main>

    <div class="hero">

      <div class="note">想看实时行情？<a href="https://quote.eastmoney.com/" target="_blank" rel="noopener">去东方财富 →</a></div>

  </main>

  <footer>
    <span>© <span id="year">2026</span> Claude 小站</span>
    <span>本站仅作服务说明，行情为示例数据。</span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <div class="rotate-tip" aria-hidden="true">
    <div class="rotate-box">
      <div class="rotate-icon">↻</div>
      <p>把手机横过来用呀～</p>
      <span>横屏之后内容更舒服</span>
