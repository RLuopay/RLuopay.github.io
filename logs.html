<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>查日志 · Claude 小站</title>
<meta name="description" content="按 QQ 号查询 Claude 套餐的开通记录与用量。" />
<link rel="stylesheet" href="style.css?v=24" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header>
    <a class="brand" href="index.html"><span class="mark">◈</span> Claude 小站</a>
    <nav>
      <a href="recharge.html">充值</a>
      <a href="logs.html" class="active">日志</a>
      <a href="stocks.html">行情</a>
      <a href="sim.html">模拟</a>
      <a href="close.html">收盘</a>
    </nav>

    <div class="user-area" id="userArea">
      <button class="user-btn" id="userBtn" aria-haspopup="dialog">登录</button>
    </div>
  </header>

  <main>
    <a class="back" href="index.html">← 返回首页</a>

    <div class="hero">
      <span class="eyebrow">Logs</span>
      <h1>查查自己的<br /><span class="grad">开通和用量</span></h1>
      <p class="lead">填 QQ 号就能看最近 5 条记录，订单号可以不填。</p>
    </div>

    <section>
      <div class="card">
        <div class="logbox">
          <div class="field"><label for="qq">QQ 号</label><input id="qq" placeholder="例如 123456789" autocomplete="off" /></div>
          <div class="field"><label for="order">订单号（可选）</label><input id="order" placeholder="例如 OP-20261110-001" autocomplete="off" /></div>
        </div>
        <div class="log-actions">
          <button class="btn btn-primary" id="logBtn">查询日志</button>
        </div>
        <div id="logResult">填好 QQ 号后点查询，会显示最近 5 次开通和用量记录。</div>
        <div class="note">演示模式：数据为本地模拟，接入后台后返回真实记录。</div>
      </div>
    </section>
  </main>

  <footer>
    <span>© <span id="year">2026</span> Claude 小站</span>
    <span>本站仅作服务说明，行情为示例数据。</span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('logBtn').addEventListener('click', function () {
      var qq = document.getElementById('qq').value.trim();
      var box = document.getElementById('logResult');
      if (!qq) { box.textContent = '先填一个 QQ 号呀～'; return; }
      if (!/^\d{5,12}$/.test(qq)) { box.textContent = 'QQ 号看起来不太对，检查一下？'; return; }
      box.textContent = '查询中…';
      setTimeout(function () {
        var d = new Date();
        var pad = function (n) { return String(n).padStart(2, '0'); };
        var t = function (off) {
          var x = new Date(d.getTime() - off * 3600 * 1000);
          return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()) + ' ' + pad(x.getHours()) + ':' + pad(x.getMinutes());
        };
        box.textContent =
          'QQ ' + qq + ' 的最近记录：\n' +
          t(2) + '  标准版 · 开通成功（30 天）\n' +
          t(5) + '  今日对话 86 次\n' +
          t(26) + '  体验版 · 已到期\n' +
          t(30) + '  体验版 · 开通成功（30 天）';
      }, 600);
    });
  </script>

  <div class="rotate-tip" aria-hidden="true">
    <div class="rotate-box">
      <div class="rotate-icon">↻</div>
      <p>把手机横过来用呀～</p>
      <span>横屏之后内容更舒服</span>
    </div>
  </div>

  <div class="user-modal" id="userModal" hidden>
    <div class="user-panel" role="dialog" aria-modal="true" aria-label="账号与资料">
      <button class="user-close" id="userClose" aria-label="关闭">×</button>
      <div id="loginBox">
        <h3>登录</h3>
        <div class="login-tabs" id="loginTabs">
          <button type="button" data-provider="wechat" class="on">微信</button>
          <button type="button" data-provider="qq">QQ</button>
          <button type="button" data-provider="email">邮箱</button>
        </div>
        <label><span id="acctLabel">微信号</span><input id="lAccount" placeholder="输入微信号" autocomplete="off" /></label>
        <label>昵称（可选）<input id="lName" autocomplete="nickname" placeholder="随便取一个" /></label>
        <label id="passWrap" hidden>密码<input id="lPass" type="password" autocomplete="current-password" placeholder="邮箱登录需要密码" /></label>
        <div class="user-actions"><button class="btn btn-primary" id="loginGo">登录 / 注册</button></div>
        <p class="user-hint">本地模拟登录，账号只存在这台浏览器里，换设备就没了。</p>
      </div>
      <div id="profileBox" hidden>
        <h3>我的资料</h3>
        <label>头像
          <select id="uAvatar">
            <option value="🙂">🙂</option><option value="😺">😺</option><option value="🐶">🐶</option>
            <option value="🐰">🐰</option><option value="🦊">🦊</option><option value="🐼">🐼</option>
            <option value="🐳">🐳</option><option value="🌸">🌸</option><option value="⭐">⭐</option>
          </select>
        </label>
        <label>昵称<input id="uName" /></label>
        <label>QQ 号<input id="uQQ" inputmode="numeric" /></label>
        <label>简介<textarea id="uBio" placeholder="写点啥都行"></textarea></label>
        <div class="user-actions">
          <button class="btn btn-primary" id="uSave">保存</button>
          <button class="btn btn-ghost" id="uLogout">退出</button>
        </div>
        <p class="user-hint">资料只保存在本机浏览器。</p>
      </div>
      <p class="user-msg" id="userMsg"></p>
    </div>
  </div>
  <script src="site.js?v=3"></script>
  <script src="pet.js?v=4"></script>
  <script src="i18n.js?v=4"></script>
</body>
</html>
