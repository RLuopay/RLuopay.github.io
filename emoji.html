<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>表情库 · Claude 小站</title>
<meta name="description" content="Claude 小表情库，点一下就能下载。" />
<link rel="stylesheet" href="style.css?v=25" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header>
    <a class="brand" href="index.html"><span class="mark">◈</span> Claude 小站</a>
    <nav>
      <a href="recharge.html">充值</a>
      <a href="emoji.html" class="active">表情</a>
      <a href="stocks.html">行情</a>
      <a href="sim.html">模拟</a>
      <a href="close.html">收盘</a>
    </nav>
    <div class="user-area" id="userArea">
      <button class="user-btn" id="userBtn" aria-haspopup="dialog">登录</button>
    </div>
  </header>

  <main>
    <a class="back" href="index.html">← 返回首页</a>

    <div class="hero">
      <span class="eyebrow">Emoji</span>
      <h1>Claude 表情库<br /><span class="grad">点一下就存走</span></h1>
      <p class="lead">九个小表情，点开下载，拿去当头像或表情包都行。</p>
    </div>

    <section>
      <div class="emoji-grid" id="emojiGrid">
        <a class="emoji-card" href="assets/pet/pet1.webp" download="claude-01.webp"><img src="assets/pet/pet1.webp" alt="Claude 表情 1" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet2.webp" download="claude-02.webp"><img src="assets/pet/pet2.webp" alt="Claude 表情 2" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet3.webp" download="claude-03.webp"><img src="assets/pet/pet3.webp" alt="Claude 表情 3" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet4.webp" download="claude-04.webp"><img src="assets/pet/pet4.webp" alt="Claude 表情 4" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet5.webp" download="claude-05.webp"><img src="assets/pet/pet5.webp" alt="Claude 表情 5" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet6.webp" download="claude-06.webp"><img src="assets/pet/pet6.webp" alt="Claude 表情 6" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet7.webp" download="claude-07.webp"><img src="assets/pet/pet7.webp" alt="Claude 表情 7" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet8.webp" download="claude-08.webp"><img src="assets/pet/pet8.webp" alt="Claude 表情 8" loading="lazy" /></a>
        <a class="emoji-card" href="assets/pet/pet9.webp" download="claude-09.webp"><img src="assets/pet/pet9.webp" alt="Claude 表情 9" loading="lazy" /></a>
      </div>
      <p class="note">点一下就下载；手机可以长按图片保存。</p>
    </section>
  </main>

  <footer>
    <span>© <span id="year">2026</span> Claude 小站</span>
    <span>表情是小站自己的，随便拿去用。</span>
  </footer>

  <div class="rotate-tip" aria-hidden="true">
    <div class="rotate-box">
      <div class="rotate-icon">↻</div>
      <p>把手机横过来用呀～</p>
      <span>横屏之后内容更舒服</span>
    </div>
  </div>

  <div class="user-modal" id="userModal" hidden>
    <div class="user-panel" role="dialog" aria-modal="true" aria-label="账号与资料">
      <button class="user-close" id="userClose" aria-label="关闭">×</button>
      <div id="loginBox">
        <h3>登录</h3>
        <div class="login-tabs" id="loginTabs">
          <button type="button" data-provider="wechat" class="on">微信</button>
          <button type="button" data-provider="qq">QQ</button>
          <button type="button" data-provider="email">邮箱</button>
        </div>
        <label><span id="acctLabel">微信号</span><input id="lAccount" placeholder="输入微信号" autocomplete="off" /></label>
        <label>昵称（可选）<input id="lName" autocomplete="nickname" placeholder="随便取一个" /></label>
        <label id="passWrap" hidden>密码<input id="lPass" type="password" autocomplete="current-password" placeholder="邮箱登录需要密码" /></label>
        <div class="user-actions"><button class="btn btn-primary" id="loginGo">登录 / 注册</button></div>
        <p class="user-hint">本地模拟登录，账号只存在这台浏览器里，换设备就没了。</p>
      </div>
      <div id="profileBox" hidden>
        <h3>我的资料</h3>
        <label>头像
          <select id="uAvatar">
            <option value="🙂">🙂</option><option value="😺">😺</option><option value="🐶">🐶</option>
            <option value="🐰">🐰</option><option value="🦊">🦊</option><option value="🐼">🐼</option>
            <option value="🐳">🐳</option><option value="🌸">🌸</option><option value="⭐">⭐</option>
          </select>
        </label>
        <label>昵称<input id="uName" /></label>
        <label>QQ 号<input id="uQQ" inputmode="numeric" /></label>
        <label>简介<textarea id="uBio" placeholder="写点啥都行"></textarea></label>
        <div class="user-actions">
          <button class="btn btn-primary" id="uSave">保存</button>
          <button class="btn btn-ghost" id="uLogout">退出</button>
        </div>
        <p class="user-hint">资料只保存在本机浏览器。</p>
      </div>
      <p class="user-msg" id="userMsg"></p>
    </div>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
  <script src="site.js?v=3"></script>
  <script src="pet.js?v=7"></script>
  <script src="i18n.js?v=4"></script>
</body>
</html>
